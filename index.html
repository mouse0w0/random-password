<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机密码生成器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --accent: #4f8cff;
  --accent-hover: #3a78f0;
  --success: #4caf50;
  --danger: #f44336;
  --radius: 10px;
}
/* 深色模式（黑色系） */
[data-theme="dark"] {
  --bg: #000000;
  --card: #0a0a0a;
  --border: #3a3a3a;
  --text: #e0e0e0;
  --text-dim: #999999;
  --input-bg: #141414;
  --input-hover: #1e1e1e;
  --display-bg: #080808;
  --copy-bg: #1e1e1e;
  --copy-hover: #2e2e2e;
  --strength-track: #2a2a2a;
  --placeholder: #555555;
  --checkbox-unchecked: #2a2a2a;
  --checkbox-border: #555555;
}
/* 浅色模式（白色系） */
[data-theme="light"] {
  --bg: #fafafa;
  --card: #ffffff;
  --border: #e0e0e8;
  --text: #1a1a2e;
  --text-dim: #999999;
  --input-bg: #f8f8fc;
  --input-hover: #f0f0f5;
  --display-bg: #fbfbfd;
  --copy-bg: #f0f0f5;
  --copy-hover: #e8e8f0;
  --strength-track: #e0e0e8;
  --placeholder: #b0b0c0;
  --checkbox-unchecked: #eee;
  --checkbox-border: #ccc;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: background .25s, color .25s;
}
.container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  width: 100%;
  max-width: 560px;
  transition: background .25s, border-color .25s;
}
.header { display: flex; align-items: center; margin-bottom: 24px; position: relative; height: 30px; }
h1 { font-size: 22px; text-align: center; position: absolute; left: 0; right: 0; margin: 0; line-height: 30px; }
.theme-toggle {
  background: var(--input-bg); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px;
  width: 36px; height: 36px; margin-left: auto;
  cursor: pointer; transition: all .15s;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  position: relative; z-index: 1;
}
.theme-toggle:hover { background: var(--input-hover); }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }
[data-theme="light"] .theme-toggle .icon-sun { display: block; }
[data-theme="light"] .theme-toggle .icon-moon { display: none; }
.section { margin-bottom: 20px; }
.section-title { font-size: 14px; color: var(--text-dim); margin-bottom: 8px; }
.length-row { display: flex; align-items: center; gap: 12px; }
.length-row input[type=range] {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 6px; border-radius: 3px; outline: none; cursor: pointer;
  background: linear-gradient(to right, var(--accent) 0%, var(--accent) 0%, var(--strength-track) 0%, var(--strength-track) 100%);
}
.length-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); cursor: pointer; margin-top: 0;
}
.length-row input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; border: none;
  background: var(--accent); cursor: pointer;
}
.length-row input[type=range]::-moz-range-progress {
  height: 6px; border-radius: 3px; background: var(--accent);
}
.length-row input[type=range]::-moz-range-track {
  height: 6px; border-radius: 3px; background: var(--strength-track);
}
.length-value {
  min-width: 48px; text-align: center;
  font-size: 18px; font-weight: bold; color: var(--accent);
}
.char-sets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.checkbox-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; user-select: none; transition: background .15s, border-color .15s;
}
.checkbox-row:hover { background: var(--input-hover); }
.checkbox-row input[type=checkbox] {
  accent-color: var(--accent); width: 16px; height: 16px;
  appearance: none; -webkit-appearance: none;
  background: var(--checkbox-unchecked);
  border: 1.5px solid var(--checkbox-border);
  border-radius: 3px; cursor: pointer; position: relative;
  flex-shrink: 0; transition: background .15s, border-color .15s;
}
.checkbox-row input[type=checkbox]:checked {
  background: var(--accent); border-color: var(--accent);
}
.checkbox-row input[type=checkbox]:checked::after {
  content: ''; position: absolute; left: 4px; top: 1px;
  width: 4px; height: 8px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.checkbox-row label { cursor: pointer; font-size: 14px; }
.text-input {
  width: 100%; background: var(--input-bg); border: 1px solid var(--border);
  color: var(--text); padding: 8px 12px; border-radius: 6px;
  font-size: 14px; margin-bottom: 10px; font-family: monospace;
}
.text-input:focus { outline: none; border-color: var(--accent); }
.text-input::placeholder { color: var(--placeholder); }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.password-display {
  background: var(--display-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; min-height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; overflow: hidden; white-space: nowrap;
  transition: background .25s, border-color .25s;
}
.password-text { font-family: 'Courier New', monospace; font-size: 18px; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.password-text.placeholder { color: var(--text-dim); font-size: 14px; }
.strength-label { font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; margin-left: 12px; }
.buttons { display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 12px; border: none; border-radius: 8px;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s;
}
.btn-generate { background: var(--accent); color: #fff; }
.btn-generate:hover { background: var(--accent-hover); }
.btn-copy { background: var(--copy-bg); color: var(--text); }
.btn-copy:hover { background: var(--copy-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: var(--success); color: #fff; padding: 10px 24px;
  border-radius: 8px; font-size: 14px; opacity: 0;
  transition: opacity .25s; pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.error { background: var(--danger); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>随机密码生成器</h1>
    <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>

  <div class="password-display">
    <span class="password-text placeholder" id="pwText">点击生成密码</span>
    <span class="strength-label" id="strengthLabel"></span>
  </div>

  <div class="section">
    <div class="section-title">密码长度</div>
    <div class="length-row">
      <input type="range" id="length" min="8" max="64" value="16">
      <span class="length-value" id="lengthVal">16</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">字符类型</div>
    <div class="char-sets">
      <div class="checkbox-row">
        <input type="checkbox" id="useUpper" checked>
        <label for="useUpper">大写字母 A-Z</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="useLower" checked>
        <label for="useLower">小写字母 a-z</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="useDigits" checked>
        <label for="useDigits">数字 0-9</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="useSpecial" checked>
        <label for="useSpecial">特殊符号</label>
      </div>
    </div>
    <input type="text" class="text-input" id="customSpecial" placeholder="自定义特殊符号（留空则用默认 !@#$%^&*）">
    <input type="text" class="text-input" id="excludeChars" placeholder="排除字符（填入不想出现的字符，如 O0Il1）">
  </div>

  <div class="section">
    <div class="section-title">高级选项</div>
    <div class="options">
      <div class="checkbox-row">
        <input type="checkbox" id="forceAll">
        <label for="forceAll">必须包含大写字母、小写字母、数字、特殊符号</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="noRepeat">
        <label for="noRepeat">无重复字符</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="noConsecutive">
        <label for="noConsecutive">无连续字符（排除 abc、123 等顺序排列）</label>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-generate" id="btnGen">生成密码</button>
    <button class="btn btn-copy" id="btnCopy" disabled>复制密码</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const DIGITS = '0123456789';
const DEFAULT_SPECIAL = '!@#$%^&*';
const STORAGE_KEY = 'passwordGenSettings';
const THEME_KEY = 'passwordGenTheme';

/* 主题管理 */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
}

function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'dark';
  applyTheme(saved);
}

/* 设置存取 */
function saveSettings() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    length: $('length').value,
    useUpper: $('useUpper').checked,
    useLower: $('useLower').checked,
    useDigits: $('useDigits').checked,
    useSpecial: $('useSpecial').checked,
    customSpecial: $('customSpecial').value,
    excludeChars: $('excludeChars').value,
    forceAll: $('forceAll').checked,
    noRepeat: $('noRepeat').checked,
    noConsecutive: $('noConsecutive').checked
  }));
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!s) return;
    $('length').value = s.length ?? 16;
    $('useUpper').checked = s.useUpper ?? true;
    $('useLower').checked = s.useLower ?? true;
    $('useDigits').checked = s.useDigits ?? true;
    $('useSpecial').checked = s.useSpecial ?? true;
    $('customSpecial').value = s.customSpecial ?? '';
    $('excludeChars').value = s.excludeChars ?? '';
    $('forceAll').checked = s.forceAll ?? false;
    $('noRepeat').checked = s.noRepeat ?? false;
    $('noConsecutive').checked = s.noConsecutive ?? false;
  } catch(e) {}
  $('lengthVal').textContent = $('length').value;
}

function getCharsets() {
  const exclude = $('excludeChars').value;
  const sets = [];
  if ($('useUpper').checked) sets.push(UPPER);
  if ($('useLower').checked) sets.push(LOWER);
  if ($('useDigits').checked) sets.push(DIGITS);
  if ($('useSpecial').checked) {
    const custom = $('customSpecial').value.trim();
    sets.push(custom || DEFAULT_SPECIAL);
  }
  if (exclude) sets = sets.map(s => [...s].filter(c => !exclude.includes(c)).join(''));
  return sets.filter(s => s.length > 0);
}

function getRandomInt(max) {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] % max;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = getRandomInt(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const SEQUENCES = [UPPER, LOWER, DIGITS];

function isConsecutive(a, b) {
  for (const seq of SEQUENCES) {
    const ia = seq.indexOf(a);
    const ib = seq.indexOf(b);
    if (ia !== -1 && ib !== -1 && Math.abs(ia - ib) === 1) return true;
  }
  return false;
}

function hasConsecutive(pw) {
  for (let i = 0; i < pw.length - 1; i++) {
    if (isConsecutive(pw[i], pw[i + 1])) return true;
  }
  return false;
}

/* 单次生成：在当前约束下生成一条密码，返回字符串或 null（失败） */
function generateOnce(length, sets, poolChars, noRepeat, forceAll) {
  let password = [];

  if (forceAll) {
    if (sets.length > length) return null;
    if (noRepeat) {
      const used = new Set();
      for (const set of sets) {
        const avail = [...set].filter(c => !used.has(c));
        if (avail.length === 0) return null;
        const c = avail[getRandomInt(avail.length)];
        password.push(c);
        used.add(c);
      }
    } else {
      for (const set of sets) {
        password.push(set[getRandomInt(set.length)]);
      }
    }
    const remaining = length - sets.length;
    if (remaining > 0) {
      if (noRepeat) {
        const used = new Set(password);
        const avail = poolChars.filter(c => !used.has(c));
        if (avail.length < remaining) return null;
        shuffle(avail);
        for (let i = 0; i < remaining; i++) password.push(avail[i]);
      } else {
        for (let i = 0; i < remaining; i++) password.push(poolChars[getRandomInt(poolChars.length)]);
      }
    }
  } else {
    if (noRepeat) {
      shuffle(poolChars);
      password = poolChars.slice(0, length);
    } else {
      for (let i = 0; i < length; i++) password.push(poolChars[getRandomInt(poolChars.length)]);
    }
  }

  shuffle(password);
  return password.join('');
}

function generate() {
  const length = parseInt($('length').value);
  const sets = getCharsets();
  const noRepeat = $('noRepeat').checked;
  const noConsecutive = $('noConsecutive').checked;
  const forceAll = $('forceAll').checked;

  if (sets.length === 0) { showToast('请至少选择一种字符类型', true); return; }

  let poolChars = [...sets.join('')];

  if (noRepeat && poolChars.length < length) {
    showToast('字符池不足以生成不重复密码', true);
    return;
  }

  let result = generateOnce(length, sets, poolChars, noRepeat, forceAll);
  if (result === null) {
    showToast('当前设置下字符池不足，请放宽条件', true);
    return;
  }

  if (noConsecutive && hasConsecutive(result)) {
    let attempts = 0;
    const maxAttempts = 200;
    while (attempts < maxAttempts) {
      attempts++;
      result = generateOnce(length, sets, poolChars, noRepeat, forceAll);
      if (result !== null && !hasConsecutive(result)) break;
    }
    if (result === null || hasConsecutive(result)) {
      showToast('当前设置下难以避免连续字符，请放宽条件', true);
      return;
    }
  }

  displayPassword(result);
}

function displayPassword(pw) {
  $('pwText').textContent = pw;
  $('pwText').classList.remove('placeholder');
  $('btnCopy').disabled = false;
  updateStrength(pw);
  saveSettings();
}

function updateStrength(pw) {
  const len = pw.length;
  let pool = 0;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^A-Za-z0-9]/.test(pw)) pool += 32;
  const bits = len * Math.log2(pool || 1);
  let color, label;
  if (bits < 28) { color = '#f44336'; label = '非常弱'; }
  else if (bits < 40) { color = '#ff5722'; label = '弱'; }
  else if (bits < 60) { color = '#ff9800'; label = '中'; }
  else if (bits < 80) { color = '#4caf50'; label = '强'; }
  else { color = '#2e7d32'; label = '非常强'; }
  $('strengthLabel').textContent = label;
  $('strengthLabel').style.color = color;
}

function copyPassword() {
  const pw = $('pwText').textContent;
  if (!pw || pw === '点击生成密码') return;
  navigator.clipboard.writeText(pw).then(() => showToast('已复制到剪贴板'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = pw;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制到剪贴板');
    });
}

let toastTimer;
function showToast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* 配置变更时重新生成 */
function onSettingChange() {
  saveSettings();
  generate();
}

/* 更新滑条渐变 */
function updateRangeFill(el) {
  const min = parseInt(el.min) || 0;
  const max = parseInt(el.max) || 100;
  const val = parseInt(el.value);
  const pct = ((val - min) / (max - min)) * 100;
  el.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, var(--strength-track) ${pct}%, var(--strength-track) 100%)`;
}

/* 事件绑定 */
$('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
  updateRangeFill($('length'));
});
$('length').addEventListener('input', e => {
  $('lengthVal').textContent = e.target.value;
  updateRangeFill(e.target);
  onSettingChange();
});
['useUpper','useLower','useDigits','useSpecial','forceAll','noRepeat','noConsecutive'].forEach(id => {
  $(id).addEventListener('change', onSettingChange);
});
let textDebounce;
$('customSpecial').addEventListener('input', () => {
  clearTimeout(textDebounce);
  textDebounce = setTimeout(onSettingChange, 300);
});
$('excludeChars').addEventListener('input', () => {
  clearTimeout(textDebounce);
  textDebounce = setTimeout(onSettingChange, 300);
});
$('btnGen').addEventListener('click', generate);
$('btnCopy').addEventListener('click', copyPassword);

/* 初始化 */
loadTheme();
loadSettings();
updateRangeFill($('length'));
generate();
</script>
</body>
</html>
